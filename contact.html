<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>聯絡我們｜數學練習</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="practice-panel content-panel">
        <header class="page-header">
          <p class="eyebrow">Contact</p>
          <h1>聯絡我們</h1>
          <p>
            如果你對題目設計、介面操作或小遊戲有建議，可以透過此頁面提供回饋。
          </p>
        </header>

        <section class="content-section">
          <h2>回饋內容</h2>
          <ul>
            <li>題目太難或太簡單。</li>
            <li>手寫辨識結果不符合預期。</li>
            <li>想新增其他練習模式或小遊戲。</li>
            <li>發現畫面在手機或平板上顯示異常。</li>
          </ul>
        </section>

        <section class="content-section">
          <h2>聯絡方式</h2>
          <p>
            目前請使用 GitHub Issues 或網站擁有者提供的聯絡方式回報。若之後新增正式電子郵件，會更新在這個頁面。
          </p>
        </section>

        <section class="content-section">
          <h2>提醒</h2>
          <p>
            為保護兒童隱私，回饋時請不要提供孩子的姓名、學校、住址、電話或其他可以辨識個人的資料。
          </p>
        </section>

        <footer class="site-footer">
          <a href="index.html">回到練習</a>
          <a href="about.html">關於</a>
          <a href="privacy.html">隱私權政策</a>
        </footer>
      </section>
    </main>
  </body>
</html>
