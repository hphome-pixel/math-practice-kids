<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>數學練習</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="practice-panel" aria-labelledby="app-title">
        <div class="topbar">
          <div>
            <p class="eyebrow">Math Practice</p>
            <h1 id="app-title">數學練習</h1>
          </div>
          <div class="top-actions">
            <button class="secondary-button compact-button" id="settingsButton" type="button">設定</button>
            <div class="stars" id="stars" aria-label="答對星星">☆☆☆☆☆</div>
          </div>
        </div>

        <section class="setup-view" id="setupView">
          <div class="field-group">
            <h2>選擇練習</h2>
            <div class="mode-grid" role="radiogroup" aria-label="練習模式">
              <label class="mode-card">
                <input type="radio" name="practiceMode" value="add" checked />
                <strong class="mode-symbol">+</strong>
                <span>加法練習</span>
                <small>直式加法、進位練習</small>
              </label>
              <label class="mode-card">
                <input type="radio" name="practiceMode" value="subtract" />
                <strong class="mode-symbol">−</strong>
                <span>減法練習</span>
                <small>直式減法、借位練習</small>
              </label>
              <label class="mode-card">
                <input type="radio" name="practiceMode" value="multiply" />
                <strong class="mode-symbol">×</strong>
                <span>乘法練習</span>
                <small>1 到 9 乘法表、十位乘法</small>
              </label>
              <label class="mode-card">
                <input type="radio" name="practiceMode" value="divide" />
                <strong class="mode-symbol">÷</strong>
                <span>除法練習</span>
                <small>除以 1 到 9、十位除法</small>
              </label>
              <label class="mode-card game-mode-card">
                <input type="radio" name="practiceMode" value="miniGames" />
                <strong class="mode-symbol">★</strong>
                <span>小遊戲</span>
                <small>打怪練習、拼圖解鎖</small>
              </label>
            </div>
          </div>

          <div class="field-group hidden" id="miniGameSettings">
            <h2>選擇小遊戲</h2>
            <div class="mini-game-grid" role="radiogroup" aria-label="小遊戲">
              <label class="option-card">
                <input type="radio" name="miniGameMode" value="monster" checked />
                <span>打怪練習</span>
                <small>先選題型，答對攻擊</small>
              </label>
              <label class="option-card">
                <input type="radio" name="miniGameMode" value="puzzle" />
                <span>拼圖解鎖</span>
                <small>答對一題，解鎖一片圖片</small>
              </label>
            </div>
            <h2>選擇題目</h2>
            <div class="segmented mini-operation-options" role="radiogroup" aria-label="小遊戲題目">
              <label><input type="radio" name="miniGameOperation" value="add" checked />加法</label>
              <label><input type="radio" name="miniGameOperation" value="subtract" />減法</label>
              <label><input type="radio" name="miniGameOperation" value="multiply" />乘法</label>
              <label><input type="radio" name="miniGameOperation" value="mixed" />混合</label>
            </div>
          </div>

          <div class="field-group" id="arithmeticSettings">
            <h2>選擇位數</h2>
            <div class="option-grid" role="radiogroup" aria-label="位數">
              <label class="option-card">
                <input type="radio" name="digits" value="1" checked />
                <span>個位</span>
                <small>0 到 10</small>
              </label>
              <label class="option-card">
                <input type="radio" name="digits" value="2" />
                <span>十位</span>
                <small>10 到 99</small>
              </label>
              <label class="option-card">
                <input type="radio" name="digits" value="3" />
                <span>百位</span>
                <small>100 到 999</small>
              </label>
              <label class="option-card">
                <input type="radio" name="digits" value="4" />
                <span>千位</span>
                <small>1000 到 9999</small>
              </label>
            </div>

            <h2>難度設定</h2>
            <div class="difficulty-grid">
              <div id="addDifficultySettings">
                <h3>加法</h3>
                <div class="segmented two-options" role="radiogroup" aria-label="加法難度">
                  <label><input type="radio" name="addDifficulty" value="any" checked />不限</label>
                  <label><input type="radio" name="addDifficulty" value="noCarry" />不進位</label>
                  <label><input type="radio" name="addDifficulty" value="carry" />有進位</label>
                </div>
              </div>
              <div id="subtractDifficultySettings">
                <h3>減法</h3>
                <div class="segmented two-options" role="radiogroup" aria-label="減法難度">
                  <label><input type="radio" name="subtractDifficulty" value="any" checked />不限</label>
                  <label><input type="radio" name="subtractDifficulty" value="noBorrow" />不借位</label>
                  <label><input type="radio" name="subtractDifficulty" value="borrow" />有借位</label>
                </div>
              </div>
            </div>
          </div>

          <div class="field-group hidden" id="multiplySettings">
            <h2>乘法測驗</h2>
            <div class="times-grid" role="radiogroup" aria-label="乘法設定">
              <label><input type="radio" name="multiplyMode" value="table-1" checked />1</label>
              <label><input type="radio" name="multiplyMode" value="table-2" />2</label>
              <label><input type="radio" name="multiplyMode" value="table-3" />3</label>
              <label><input type="radio" name="multiplyMode" value="table-4" />4</label>
              <label><input type="radio" name="multiplyMode" value="table-5" />5</label>
              <label><input type="radio" name="multiplyMode" value="table-6" />6</label>
              <label><input type="radio" name="multiplyMode" value="table-7" />7</label>
              <label><input type="radio" name="multiplyMode" value="table-8" />8</label>
              <label><input type="radio" name="multiplyMode" value="table-9" />9</label>
              <label class="wide-option"><input type="radio" name="multiplyMode" value="tens" />十位乘法</label>
              <label class="wide-option"><input type="radio" name="multiplyMode" value="hundreds" />百位乘法</label>
            </div>

            <h2>乘法表背誦</h2>
            <div class="times-grid" role="radiogroup" aria-label="乘法表背誦">
              <label><input type="radio" name="multiplyMode" value="recite-1" />1 表</label>
              <label><input type="radio" name="multiplyMode" value="recite-2" />2 表</label>
              <label><input type="radio" name="multiplyMode" value="recite-3" />3 表</label>
              <label><input type="radio" name="multiplyMode" value="recite-4" />4 表</label>
              <label><input type="radio" name="multiplyMode" value="recite-5" />5 表</label>
              <label><input type="radio" name="multiplyMode" value="recite-6" />6 表</label>
              <label><input type="radio" name="multiplyMode" value="recite-7" />7 表</label>
              <label><input type="radio" name="multiplyMode" value="recite-8" />8 表</label>
              <label><input type="radio" name="multiplyMode" value="recite-9" />9 表</label>
            </div>
          </div>

          <div class="field-group hidden" id="divideSettings">
            <h2>除法設定</h2>
            <div class="times-grid" role="radiogroup" aria-label="除法設定">
              <label><input type="radio" name="divideMode" value="divide-1" checked />除以 1</label>
              <label><input type="radio" name="divideMode" value="divide-2" />除以 2</label>
              <label><input type="radio" name="divideMode" value="divide-3" />除以 3</label>
              <label><input type="radio" name="divideMode" value="divide-4" />除以 4</label>
              <label><input type="radio" name="divideMode" value="divide-5" />除以 5</label>
              <label><input type="radio" name="divideMode" value="divide-6" />除以 6</label>
              <label><input type="radio" name="divideMode" value="divide-7" />除以 7</label>
              <label><input type="radio" name="divideMode" value="divide-8" />除以 8</label>
              <label><input type="radio" name="divideMode" value="divide-9" />除以 9</label>
              <label class="wide-option"><input type="radio" name="divideMode" value="tens" />十位除法</label>
            </div>
          </div>

          <div class="field-group" id="practiceOptions">
            <h2>練習選項</h2>
            <div class="settings-grid">
              <label class="toggle-card">
                <input type="checkbox" id="timedModeToggle" />
                <span>限時模式</span>
                <small><input class="time-input" id="timeLimitInput" type="number" min="10" max="600" step="10" value="60" /> 秒內一直答題</small>
              </label>
            </div>
          </div>

          <div class="daily-card" id="dailyCard">
            <h2>今日練習</h2>
            <div id="dailySummary">今天還沒完成練習</div>
          </div>

          <button class="primary-button" id="startButton" type="button">開始 10 題</button>
        </section>

        <section class="settings-view hidden" id="settingsView">
          <div class="settings-header">
            <h2>設定</h2>
            <button class="secondary-button compact-button" id="settingsBackButton" type="button">回主選單</button>
          </div>
          <label class="toggle-card">
            <input type="checkbox" id="soundToggle" checked />
            <span>鼓勵音效</span>
            <small>答對答錯都有提示音，可以隨時關閉</small>
          </label>
          <div class="version-card">
            <span>版本</span>
            <strong>v1.1.0</strong>
          </div>
        </section>

        <section class="quiz-view hidden" id="quizView" aria-live="polite">
          <div class="quiz-actions">
            <button class="secondary-button compact-button" id="stopButton" type="button">停止練習</button>
          </div>
          <div class="progress-row">
            <span id="questionCount">第 1 / 10 題</span>
            <span id="scoreText">答對 0 題</span>
            <span class="timer-text hidden" id="timerText">剩 60 秒</span>
          </div>
          <div class="progress-bar" aria-hidden="true">
            <div id="progressFill"></div>
          </div>

          <div class="question-card">
            <div class="question" id="questionText">3 + 4 = ?</div>
            <p class="feedback hidden" id="feedbackText"></p>
            <form id="answerForm" autocomplete="off">
              <input id="answerInput" name="answer" type="hidden" />
              <button class="secondary-button" id="clearWritingButton" type="button">清除手寫</button>
              <button class="primary-button" id="submitAnswerButton" type="submit">確認</button>
            </form>
          </div>
        </section>

        <section class="monster-view hidden" id="monsterView" aria-live="polite">
          <div class="quiz-actions">
            <button class="secondary-button compact-button" id="monsterStopButton" type="button">停止遊戲</button>
          </div>
          <div class="monster-hud">
            <span id="monsterQuestionCount">第 1 / 10 題</span>
            <span id="monsterScoreText">打中 0 次</span>
          </div>
          <div class="monster-card">
            <div class="monster-scene">
              <div class="monster" id="monsterEnemy" aria-label="怪物">
                <span class="monster-face">×</span>
              </div>
              <div class="monster-health" aria-hidden="true">
                <div id="monsterHealthFill"></div>
              </div>
            </div>
            <div class="monster-question" id="monsterQuestion">3 × 4 = ?</div>
            <div class="choice-grid" id="monsterChoices"></div>
            <p class="feedback hidden" id="monsterFeedback"></p>
          </div>
        </section>

        <section class="puzzle-view hidden" id="puzzleView" aria-live="polite">
          <div class="quiz-actions">
            <button class="secondary-button compact-button" id="puzzleStopButton" type="button">停止遊戲</button>
          </div>
          <div class="puzzle-hud">
            <span id="puzzleQuestionCount">第 1 / 9 題</span>
            <span id="puzzleScoreText">解鎖 0 / 9 片</span>
          </div>
          <div class="puzzle-card">
            <div class="puzzle-board" id="puzzleBoard"></div>
            <div class="puzzle-question" id="puzzleQuestion">3 + 4 = ?</div>
            <div class="choice-grid" id="puzzleChoices"></div>
            <p class="feedback hidden" id="puzzleFeedback"></p>
            <button class="primary-button hidden" id="puzzleResultButton" type="button">看成績</button>
          </div>
        </section>

        <section class="recite-view hidden" id="reciteView" aria-live="polite">
          <div class="recite-header">
            <button class="secondary-button compact-button" id="reciteBackButton" type="button">回主選單</button>
            <div class="recite-switcher" aria-label="切換乘法表">
              <button class="secondary-button compact-button" id="toggleAnswersButton" type="button">遮住答案</button>
              <button class="secondary-button compact-button" id="prevTableButton" type="button">上一表</button>
              <button class="secondary-button compact-button" id="nextTableButton" type="button">下一表</button>
            </div>
          </div>
          <div class="recite-card">
            <h2 id="reciteTitle">1 的乘法表</h2>
            <div class="recite-list" id="reciteList"></div>
          </div>
        </section>

        <section class="result-view hidden" id="resultView">
          <h2>練習完成</h2>
          <div class="result-score" id="resultScore">8 / 10</div>
          <p id="resultMessage">很棒，繼續保持！</p>
          <div class="review-panel hidden" id="reviewPanel">
            <h2>答題紀錄</h2>
            <div class="review-list" id="reviewList"></div>
          </div>
          <div class="result-actions">
            <button class="secondary-button hidden" id="wrongOnlyButton" type="button">只練錯題</button>
            <button class="secondary-button" id="againButton" type="button">再練一次</button>
            <button class="primary-button" id="changeButton" type="button">重新選擇</button>
          </div>
        </section>
        <footer class="site-footer">
          <a href="about.html">關於</a>
          <a href="privacy.html">隱私權政策</a>
          <a href="contact.html">聯絡我們</a>
        </footer>
      </section>
    </main>

    <script src="script.js"></script>
  </body>
</html>
